[package]
name = "Scourgify"
version = "0.8.0"
description = "Windows Quick Access privacy manager with rule-driven cleanup and history"
authors = ["Stein Gu <steinsgu@gmail.com>"]
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Hellager/scourgify"
readme = "../README.md"
keywords = ["windows", "quick-access", "privacy", "cleanup", "tauri"]
categories = ["gui", "os::windows-apis"]
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scourgify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
log = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-autostart = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-log = "2.0.0"
tauri-plugin-opener = "2.0.0"
tauri-plugin-os = "2.0.0"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-notification = "2.0.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["clock", "serde"] }
csv = "1.4.0"
tempfile = "3.20"
fake = { version = "5.1", features = ["chrono"] }
jieba-rs = "0.10.3"
unicode-segmentation = "1.13.3"

[target.'cfg(windows)'.dependencies]
wincent = { git = "https://github.com/Hellager/wincent-rs.git", rev = "8eea2155e7afbe3d22e5e85fe061b2df2232533c" }
winreg = "0.56.0"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
